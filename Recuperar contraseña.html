<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar Contraseña</title>
<link rel="stylesheet" href="Rep contraseña.css">
</head>
<body>

  <div class="contenedor">

    <p class="titulo">
      ¿Olvidaste la contraseña? No te preocupes? Es posible recuperarla.
    </p>

    <div class="grupo-email">
      <label class="etiqueta" for="email">EMAIL</label>
      <div class="caja-input">
        <span class="icono">&#128100;</span>
        <input type="email" id="email" placeholder="Ingrese el email">
      </div>
    </div>

    <button class="btn-recuperar">
      <span>RECUPERAR CONTRASEÑA</span>
    </button>

  </div>

</body>
</html>
