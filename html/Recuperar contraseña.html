<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar Contraseña</title>
<link rel="stylesheet" href="../css/Rep Contraseña.css">
</head>
<body>

  <div class="contenedor">

    <p class="titulo">
      ¿Olvidaste la contraseña? No te preocupes? Es posible recuperarla.
    </p>

    <form data-form="recuperar">
    <div class="grupo-email">
      <label class="etiqueta" for="email">EMAIL</label>
      <div class="caja-input">
        <span class="icono">&#128100;</span>
        <input type="email" id="email" name="email" placeholder="Ingrese el email" required>
      </div>
    </div>

    <button class="btn-recuperar" type="submit">
      <span>RECUPERAR CONTRASEÑA</span>
    </button>
    </form>

  </div>

  <script src="../js/aplicacion.js"></script>
</body>
</html>
