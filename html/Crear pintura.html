<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calcular pintura</title>
<link rel="stylesheet" href="../css/Crear pintura.css">
</head>
<body>

  <div class="contenedor">

    <h1 class="titulo">Calcular pintura</h1>

    <form data-calculator="pintura">
    <div class="grupo-superficie">
      <label class="etiqueta" for="superficie">superficie para pintar</label>
      <input type="number" id="superficie" min="0" step="any" required>
    </div>

    <button class="btn-calcular" type="submit">&#10003; Calcular</button>
    </form>

  </div>

  <script src="../js/aplicacion.js"></script>
</body>
</html>
