<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calcular muro de ladrillo</title>
<link rel="stylesheet" href="../css/muro.css">
</head>
<body>

  <div class="pagina">

    <h1>Calcular muro de ladrillo</h1>

    <form data-calculator="muro">
    <div class="grupo">
      <label class="titulo">Espesor del muro</label>
      <div class="espesores">
        <input type="radio" name="espesor" id="e30" value="30" checked>
        <label for="e30">30cm</label>

        <input type="radio" name="espesor" id="e20" value="20">
        <label for="e20">20cm</label>
      </div>
    </div>

    <div class="grupo">
      <label class="titulo" for="largo">Largo</label>
      <input class="campo" type="number" id="largo" min="0" step="any" required>
    </div>

    <div class="grupo">
      <label class="titulo" for="alto">Alto</label>
      <input class="campo" type="number" id="alto" min="0" step="any" required>
    </div>

    <button class="btn-calcular" type="submit">✓ Calcular</button>
    </form>

  </div>

  <script src="../js/aplicacion.js"></script>
</body>
</html>
