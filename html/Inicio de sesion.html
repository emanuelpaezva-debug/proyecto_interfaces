<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar Sesión</title>
<link rel="stylesheet" href="../css/inicio de sesion.css">
</head>
<body>

  <div class="contenedor">

    <h1 class="titulo">INICIA SESIÓN</h1>
  
  
    <div class="icono-usuario">
      <img src="../img/user.webp" alt="Trabajador de construcción">
    </div>

    <form data-form="login">
    <div class="grupo-input">
      <div class="caja-input">
        <span class="icono">&#128100;</span>
        <input type="text" name="usuario" placeholder="Usuario o correo" required>
      </div>
    </div>

    <div class="grupo-input">
      <div class="caja-input">
        <span class="icono">&#128274;</span>
        <input type="password" name="contrasena" placeholder="Contraseña" required>
      </div>
    </div>

    <button class="btn-iniciar" type="submit">
      <span>INICIAR SESIÓN</span>
    </button>
    </form>

    <a class="olvidaste" href="Recuperar contraseña.html">¿Olvidaste tu contraseña?</a>

  </div>

  <script src="../js/aplicacion.js"></script>
</body>
</html>
