<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calcular techo</title>
<link rel="stylesheet" href="../css/Calcular techo.css">
</head>
<body>

  <div class="contenedor">

    <h1 class="titulo">Calcular techo</h1>

    <form data-calculator="volumen">
    <div class="grupo">
      <label class="etiqueta" for="grosor">grosor</label>
      <input type="number" id="grosor" min="0" step="any" required>
    </div>

    <div class="grupo">
      <label class="etiqueta" for="largo">Largo</label>
      <input type="number" id="largo" min="0" step="any" required>
    </div>

    <div class="grupo">
      <label class="etiqueta" for="alto">Alto</label>
      <input type="number" id="alto" min="0" step="any" required>
    </div>

    <button class="btn-calcular" type="submit">&#10003; Calcular</button>
    </form>

  </div>

  <script src="../js/aplicacion.js"></script>
</body>
</html>
