<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear tu cuenta</title>

    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>

    <div class="contenedor">

        <h1>CREAR TU CUENTA</h1>

        <img src="../img/user.webp"
             alt="Trabajador de construcción"
             class="imagen-trabajador">

        <form data-form="registro">
        <div class="campo">
            <span class="icono">♙</span>
            <input type="text" name="nombre" placeholder="NOMBRE" required>
        </div>

        <div class="campo">
            <span class="icono">♙</span>
            <input type="email" name="email" placeholder="INGRESE EMAIL" required>
        </div>

        <div class="campo">
            <span class="icono">♙</span>
            <input type="password" name="contrasena" placeholder="CONTRASEÑA" minlength="6" required>
        </div>

        <label class="terminos">
            Acepta terminos y condiciones?
            <input type="checkbox" name="terminos" required>
        </label>

        <button type="submit">
            REGISTRARSE
        </button>
        </form>

    </div>

    <script src="../js/aplicacion.js"></script>

</body>

</html>
